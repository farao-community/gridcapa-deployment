kind: Deployment
apiVersion: apps/v1
metadata:
  name: celtic-cc-runner
  labels:
    app: gridcapa
    component: runner
    region: celtic
    process: cc
spec:
  selector:
    matchLabels:
      app: gridcapa
      component: runner
      region: celtic
      process: cc
  template:
    metadata:
      labels:
        app: gridcapa
        component: runner
        region: celtic
        process: cc
    spec:
      containers:
        - name: celtic-cc-runner
          image: gridcapa-celtic-cc-runner
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: gridcapa-rabbitmq-credentials
                  key: rabbitmq-user
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gridcapa-rabbitmq-credentials
                  key: rabbitmq-password
            - name: GRIDCAPA_MINIO_USER
              valueFrom:
                secretKeyRef:
                  name: gridcapa-minio-credentials
                  key: minio-access-key
            - name: GRIDCAPA_MINIO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gridcapa-minio-credentials
                  key: minio-secret-key
          volumeMounts:
            - mountPath: /config/application.yml
              subPath: application.yml
              name: celtic-cc-runner-configmap-volume
            - mountPath: /home/farao/.itools/config.yml
              subPath: config.yml
              name: celtic-cc-runner-itools-configmap-volume
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 35
            timeoutSeconds: 2
            periodSeconds: 15
            failureThreshold: 3
            successThreshold: 1
          resources:
            requests:
              cpu: "1.0"
              memory: "2Gi"
            limits:
              cpu: "8.0"
              memory: "15Gi"
      restartPolicy: Always
      volumes:
        - name: celtic-cc-runner-configmap-volume
          configMap:
            name: celtic-cc-runner-configmap
        - name: celtic-cc-runner-itools-configmap-volume
          configMap:
            name: celtic-cc-runner-itools-configmap
