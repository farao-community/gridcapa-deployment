apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: celtic-cc-data-bridge-storage
  labels:
    app: gridcapa
    component: data-bridge-storage
    region: celtic
    process: cc
spec:
  storageClassName: azure-storage-class
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 96M
